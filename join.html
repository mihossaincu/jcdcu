<!-- ========== MEMBERSHIP / JOIN US ========== -->
<section id="join" class="section">
  <div class="container">
    <h2 class="section-title">মেম্বারশিপ ও যোগাযোগ</h2>
    <div class="join-grid">
      <!-- Membership Form -->
      <div class="join-form-wrap">
        <h3><i class="fas fa-user-plus"></i> অনলাইন সদস্যপদ ফর্ম</h3>
        <form onsubmit="handleFormSubmit(event, 'সদস্যপদ আবেদন')">
          <div class="form-group">
            <label>পূর্ণ নাম *</label>
            <input type="text" placeholder="আপনার পূর্ণ নাম" required>
          </div>
          <div class="form-group">
            <label>বিভাগ / বিষয় *</label>
            <input type="text" placeholder="যেমন: কম্পিউটার সায়েন্স" required>
          </div>
          <div class="form-group">
            <label>হলের নাম</label>
            <input type="text" placeholder="যেমন: শাহ আমানত হল">
          </div>
          <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" placeholder="০১৭xxxxxxxx" required>
          </div>
          <div class="form-group">
            <label>ইমেইল</label>
            <input type="email" placeholder="example@email.com">
          </div>
          <div class="form-group">
            <label>কেন ছাত্রদলে যোগ দিতে চান?</label>
            <textarea rows="3" placeholder="আপনার মতামত লিখুন..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">আবেদন জমা দিন</button>
        </form>
      </div>

      <!-- Contact Info -->
      <div>
        <h3 style="font-size:1.4rem;color:var(--green);margin-bottom:28px;">
          <i class="fas fa-map-marker-alt"></i> যোগাযোগের ঠিকানা
        </h3>
        <div class="contact-info-list">
          <div class="contact-item">
            <div class="contact-item__icon green"><i class="fas fa-building"></i></div>
            <div>
              <h4>দলীয় কার্যালয় / টেন্ট</h4>
              <p>চট্টগ্রাম বিশ্ববিদ্যালয় ক্যাম্পাস, চট্টগ্রাম-৪৩৩১</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-item__icon red"><i class="fas fa-phone"></i></div>
            <div>
              <h4>জরুরি মোবাইল</h4>
              <p>০১৭XX-XXXXXX (সভাপতি)<br>০১৮XX-XXXXXX (সাধারণ সম্পাদক)</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-item__icon blue"><i class="fas fa-envelope"></i></div>
            <div>
              <h4>অফিশিয়াল ইমেইল</h4>
              <p>info@cuchhatradal.org<br>contact@cuchhatradal.org</p>
            </div>
          </div>
        </div>

        <h4 style="font-weight:600;margin-bottom:16px;">সোশ্যাল মিডিয়া</h4>
        <div class="social-links">
          <a href="#" class="fb" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="x" aria-label="X"><i class="fab fa-x-twitter"></i></a>
          <a href="#" class="yt" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
          <a href="#" class="ig" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
    </div>
  </div>
</section>
